      - {label: FP8 weights, number: ms_fp8}
      - {label: FP8 + FP4 weights, number: ms_hyb, highlight: true}
diagrams:
  - id: request-path
    title: From request to audio
    nodes:
      - {id: c, label: client, sub: "POST /v1/audio/speech", col: 0, row: 0, kind: io}
      - {id: g, label: Go gateway, sub: "HTTP, one goroutine per stream", col: 1, row: 0}
      - {id: e, label: engine process, sub: "continuous batching, packed prefill", col: 2, row: 0}
      - {id: t, label: Talker + predictor, sub: "one CUDA graph per step", col: 2, row: 1}
      - {id: k, label: streaming codec, sub: "fused Triton kernels", col: 1, row: 1}
      - {id: o, label: PCM chunks, sub: "s16le, 24 kHz", col: 0, row: 1, kind: io}
    edges:
      - {from: c, to: g}
      - {from: g, to: e, label: Unix socket}
      - {from: e, to: t}
      - {from: t, to: k, label: codes}
      - {from: k, to: o, label: audio}

sections:
  - title: Results
    emoji: "📈"
    id: results
    body: |
      One GB10, Qwen3-TTS-12Hz-1.7B CustomVoice, streaming HTTP. Every server ran alone on the same box with the same multi-process client,
      each client sending requests back to back: three runs at 8 to 64 clients, two at 128 and 256, and one run of three requests at 1 client.
      vLLM-Omni 0.32 and sglang-omni 0.2 ran at their default limits ([setups](docs/benchmarks.md#competitor-setups)).
    charts: [throughput]
    tables: [latency]
    after: |
      "Voice heard" is when a listener hears speech: the first byte, plus any stall, plus the silence a clip opens with.

      - ✅ **Throughput:** {{ n.vs_sglang_lo }} to {{ n.vs_sglang_hi }} sglang-omni, and {{ n.vs_vllm }} vLLM-Omni as a geometric mean over the loads measured.
      - ✅ **Every request completed.** sglang-omni rejected {{ n.rej128 }} of {{ n.req128 }} at 128 clients and {{ n.rej256 }} of {{ n.req256 }} at 256, at its default queue limit.
      - ❌ **Behind:** real-time factor at 256 clients, {{ n.rtf256 }} against {{ n.rtf256_sglang }} on the requests sglang-omni kept.
      - 🧪 **Not measured:** vLLM-Omni at 16 clients, and more than one GB10.
  - title: Does it keep up with playback?
    emoji: "🎧"
    id: playback
    charts: [late]
    body: |
      Up to 128 clients a small client buffer hides the gaps. At 256 the engine generates at real time with no headroom, so {{ n.late256 }} of
      requests have a late chunk, by {{ n.late256_ms }} at p90.
  - title: How it works
    emoji: "🧩"
    id: how-it-works
    images:
      - {src: assets/how.gif, alt: "Three places the engine reads fewer bytes per step: FP8 and FP4 weights, live INT8 KV, a fused codec decoder", width: "900"}
    diagrams: [request-path]
    body: |
      FP8 weights halve what each step streams from memory, batched attention reads only each stream's own live KV, and the codec decoder's stages are
      fused into single kernels. Details: [docs/techniques.md](docs/techniques.md).
    charts: [single]
  - title: Accuracy
    emoji: "🎯"
    id: accuracy
    body: |
      Word error rate through each system's own server on one GB10, with final default settings: the same 300 LibriSpeech test-clean texts, four runs at
      each of 32 and 64 clients, {{ n.wer_clips }} clips from this engine, scored with Whisper large-v3 ([intervals](docs/benchmarks.md#accuracy-through-the-server)).

      | System | WER | Excluding garbled clips | Garbled clips |
      |---|---:|---:|---:|
      | This engine | {{ n.wer_uqt }} | {{ n.werx_uqt }} | {{ n.bad_uqt }} |
      | sglang-omni 0.2 | {{ n.wer_sglang }} | {{ n.werx_sglang }} | {{ n.bad_sglang }} |
      | vLLM-Omni 0.32 | {{ n.wer_vllm }} | {{ n.werx_vllm }} | {{ n.bad_vllm }} |

      A garbled clip has more than half its words wrong.

      - 🟰 **Level** on ordinary clips, where all three agree within the interval.
      - ❌ **Behind** sglang-omni on overall WER, by 0.50 points (95% interval 0.07 to 1.04), because this engine made more garbled clips in this test.
quickstart:
  - title: On a GB10, in the NGC PyTorch 25.10 container ([setup](docs/running.md))
    shell: |
      (cd gateway && go build -o uqt-gw .)
      UQT_NO_PDL=1 python -m uqt.engine_proc --sock /tmp/uqt.sock --max-slots 256 --max-len 512 --weights hyb &
      ./gateway/uqt-gw -sock /tmp/uqt.sock -addr 127.0.0.1:8091 &
      curl -s http://127.0.0.1:8091/v1/audio/speech -H "Content-Type: application/json" \
        -d '{"input": "Hello from one GB10.", "voice": "Ryan", "language": "English"}' > out.pcm
caveats:
  - "One box, one model variant and one voice. Throughput between runs at 64 clients ranged from 88 to 122 audio-s/s."
  - "sglang-omni at 1, 128 and 256 clients and vLLM-Omni were measured two days before the other runs, on the same machine."
  - "The first start compiles and captures every kernel and graph and takes many minutes with hybrid weights."
  - "sglang-omni needs a one-line patch to start on GB10, because one of its Triton kernels exceeds the chip's shared memory."
repo_map:
  - {path: uqt/, desc: "engines, kernels, FP8 weights, streaming codec, engine process"}
  - {path: gateway/, desc: "Go streaming gateway"}
  - {path: bench/gb10/, desc: "GB10 benchmarks, accuracy checks, profilers"}
  - {path: results/gb10/, desc: "raw measurements; release.json is what this page reads"}
  - {path: docs/, desc: "running, techniques, benchmarks"}
  - {path: tools/release_numbers.py, desc: "raw runs to release.json"}
footer: "The code predictor and streaming codec decoder are adapted from vLLM-Omni (Apache-2.0). Built at Magni."
