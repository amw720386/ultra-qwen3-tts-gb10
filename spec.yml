intro: |
  ultra-qwen3-tts-gb10 is a streaming inference engine for
  [Qwen3-TTS-12Hz-1.7B](https://huggingface.co/Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice) on the NVIDIA GB10. It is Python and Triton on
  PyTorch, with a Go gateway that streams raw PCM over HTTP. Decode on this chip is limited by its 273 GB/s of unified memory, so most of
  the work goes into reading fewer bytes per step.

video:
  mp4: assets/launch.mp4
  gif: assets/launch-preview.gif
  poster: assets/launch-poster.png
  srt: assets/launch.srt
  caption: "Launch video: how it works, throughput, playback gaps. Click for the mp4."
  fps: 30
  music: false
  poster_at: 36.5
  scenes:
    - type: title
      title: Qwen3-TTS on one GB10
      subtitle: "{{ n.vs_sglang }} the throughput of sglang-omni, geometric mean over 1 to 256 clients"
      chips: [same model, same box, same client]
      say: "Streaming Qwen3-TTS on one NVIDIA GB10."
    - type: how
      kicker: How · GB10 · 273 GB/s unified memory
      heading: Read fewer bytes every step.
      boxes:
        - {label: weights, body: "FP8 halves what a step reads. With one or two streams, FP4.", glyph: {cols: 16, rows: 1, color: accent, lit: [0, 1, 2, 3, 4, 5, 6, 7]}}
        - {label: attention, body: "Each stream reads only its own live KV, stored as INT8.", glyph: {cols: 10, rows: 3, color: accent, lit: [0, 1, 2, 3, 4, 5, 6, 10, 11, 12, 13, 20, 21, 22, 23, 24, 25, 26, 27, 28]}}
        - {label: codec, body: "Residual units, upsampling and output each run as one fused kernel.", glyph: {cols: 3, rows: 1, color: accent, lit: [0, 1, 2]}}
      min_dur: 7
      gif: assets/how.gif
      gif_start: 0
      say: "Decode is limited by memory bandwidth, so the engine moves fewer bytes per step."
    - type: chart
      chart: single
      min_dur: 5.5
      say: "One stream: {{ n.ms_bf16 }} per audio frame in BF16, {{ n.ms_hyb }} with FP8 and FP4 weights."
    - type: chart
      chart: throughput
      min_dur: 9
      gif: assets/throughput.gif
      say: "Throughput from 1 to 256 clients, against sglang-omni and vLLM-Omni on the same box."
    - type: chart
      chart: late
      min_dur: 8
      gif: assets/late.gif
      say: "At 128 clients, {{ n.late128 }} of requests have any audio chunk arrive late."
    - type: end
      style: launch
      kicker: Qwen3-TTS 1.7B · one GB10 · 8 clients
      title: "2× sglang-omni's throughput."
      bars:
        - {label: This engine, number: t8, unit: audio-s/s, highlight: true}
        - {label: sglang-omni, number: t8_sglang, unit: audio-s/s}
        - {label: vLLM-Omni, number: t8_vllm, unit: audio-s/s}
      subtitle: "Streaming HTTP, 8 back-to-back clients, medians of three runs, the load closest to the geometric mean of {{ n.vs_sglang }} over 1 to 256 clients."
      credit: Made at Magni
      min_dur: 6
      say: ""

