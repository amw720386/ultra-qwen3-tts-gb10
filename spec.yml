      - {key: sglang_first, title: "sglang-omni", align: right, fmt: "{:,.0f}"}
      - {key: vllm_first, title: "vLLM-Omni", align: right, fmt: "{:,.0f}"}
      - {key: uqt_heard, title: "Voice heard, this engine", align: right, fmt: "{:,.0f}"}
      - {key: sglang_heard, title: "sglang-omni", align: right, fmt: "{:,.0f}"}
      - {key: vllm_heard, title: "vLLM-Omni", align: right, fmt: "{:,.0f}"}
charts:
  - id: throughput
    type: gbar
    title: Throughput by number of clients
    subtitle: audio seconds generated per second · one GB10 · streaming HTTP · medians
    file: results/gb10/release.json
    rows_path: head_to_head
    cat: clients
    series: system
    y: throughput
    fmt: "{:.0f}"
  - id: late
    type: gbar
    title: Requests with a late audio chunk
    subtitle: percent of requests · no client buffer · any delay counts · medians
    file: results/gb10/release.json
    rows_path: head_to_head
    cat: clients
    series: system
    y: late_pct
    ymax: 100
    fmt: "{:.0f}"
    better: lower
